name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis
        run: npm run check

      - name: Tests
        run: npm test

  contrato:
    name: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6

      - name: Compilar
        run: forge build --sizes

      - name: Tests
        run: forge test -vvv
