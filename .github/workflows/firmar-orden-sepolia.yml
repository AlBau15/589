name: Firmar orden de prueba (Arbitrum Sepolia)

# Se lanza a mano desde la pestaña Actions. Firma una orden de prueba con la clave del operador y
# muestra en el resumen del job los valores para pagarla desde Remix (approve + pagarOrden).
# La firma no es secreta: es lo que el comprador envía al contrato. La clave nunca se imprime.
#
# Usa del environment "arbitrum-sepolia":
#   OPERADOR_PRIVATE_KEY      clave del operador del contrato (si no existe, usa DEPLOYER_PRIVATE_KEY)
#   ARBITRUM_SEPOLIA_RPC_URL  URL de RPC de Arbitrum Sepolia

on:
  workflow_dispatch:
    inputs:
      contrato:
        description: Dirección del contrato PagoAtomicoMXNB
        required: true
        default: "0xFFcBE0476f7F1601D06Cc452455E4F148a12Cf46"
      comprador:
        description: Wallet que pagará la orden (0x...)
        required: true
      creador:
        description: Wallet que recibirá el pago menos la comisión (0x...)
        required: true
      monto:
        description: Monto en MXNB (p. ej. 100 o 12.5)
        required: true
        default: "100"
      minutos:
        description: Minutos de vigencia de la orden
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  firmar:
    name: firmar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: arbitrum-sepolia
    env:
      CONTRATO: ${{ inputs.contrato }}
      COMPRADOR: ${{ inputs.comprador }}
      CREADOR: ${{ inputs.creador }}
      MONTO: ${{ inputs.monto }}
      MINUTOS: ${{ inputs.minutos }}
    steps:
      - name: Validar parámetros
        run: |
          set -euo pipefail
          for nombre in CONTRATO COMPRADOR CREADOR; do
            valor="${!nombre}"
            if [[ ! "$valor" =~ ^0x[0-9a-fA-F]{40}$ ]] || [[ "$valor" =~ ^0x0{40}$ ]]; then
              echo "::error::$nombre no es una dirección válida: $valor"
              exit 1
            fi
          done
          if [[ ! "$MONTO" =~ ^[0-9]+(\.[0-9]{1,6})?$ ]] || [[ "$MONTO" =~ ^0+(\.0+)?$ ]]; then
            echo "::error::monto debe ser un número positivo con hasta 6 decimales: $MONTO"
            exit 1
          fi
          if [[ ! "$MINUTOS" =~ ^[0-9]+$ ]] || (( MINUTOS < 1 || MINUTOS > 1440 )); then
            echo "::error::minutos debe ser un entero entre 1 y 1440: $MINUTOS"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Firmar
        env:
          CLAVE: ${{ secrets.OPERADOR_PRIVATE_KEY || secrets.DEPLOYER_PRIVATE_KEY }}
          RPC: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
        run: |
          set -euo pipefail
          limpiar() { local v="${1//[[:space:]]/}"; v="${v#[\"\']}"; v="${v%[\"\']}"; printf '%s' "$v"; }
          CLAVE=$(limpiar "$CLAVE")
          RPC=$(limpiar "$RPC")
          if [[ -z "$CLAVE" ]]; then
            echo "::error::Falta el secret OPERADOR_PRIVATE_KEY (o DEPLOYER_PRIVATE_KEY) en el environment arbitrum-sepolia"
            exit 1
          fi
          [[ "$CLAVE" =~ ^[0-9a-fA-F]{64}$ ]] && CLAVE="0x$CLAVE"
          if [[ ! "$CLAVE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::La clave del operador debe tener 64 caracteres hexadecimales (con o sin 0x)"
            exit 1
          fi

          salida=$(OPERADOR_PRIVATE_KEY="$CLAVE" ARBITRUM_RPC_URL="$RPC" ARBITRUM_TESTNET=1 \
            node scripts/firmar-orden.mjs "$CONTRATO" "$COMPRADOR" "$CREADOR" "$MONTO" "$MINUTOS")
          echo "$salida"
          {
            echo "## Orden firmada"
            echo ""
            echo "Págala desde la wallet del comprador (\`$COMPRADOR\`) antes de que caduque."
            echo "Pasos en [docs/contrato.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/contrato.md#probar-una-compra-en-testnet-sin-backend)."
            echo ""
            echo '```'
            echo "$salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
